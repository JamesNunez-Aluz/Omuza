name: Migrations

on:
  pull_request:
    paths:
      - "packages/db/**"

jobs:
  migrate-from-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance_test_password
          POSTGRES_DB: resonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://resonance:resonance_test_password@localhost:5432/resonance_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to a clean database
        run: pnpm --filter @resonance/db migrate
      - name: Seed synthetic demo data
        run: pnpm db:seed
