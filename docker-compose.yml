services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance_dev_password
      POSTGRES_DB: resonance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance -d resonance"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
